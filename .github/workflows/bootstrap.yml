name: Importar proyecto y compilar NODO
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar-y-compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Importar codigo fuente de NODO
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/nodo-sources.tar.gz
          tar -xzf bootstrap/nodo-sources.tar.gz
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Añadir NODO Android v0.1 alfa y flujo APK"
            git push origin HEAD:main
          fi
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar plataforma Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK inicial
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: NODO-v0.1-alfa-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
