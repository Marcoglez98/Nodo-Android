name: Compilar NODO APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo fuente
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar paquetes Android 35
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK de prueba
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: NODO-v0.1-alpha-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
