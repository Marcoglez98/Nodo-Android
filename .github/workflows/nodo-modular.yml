name: NODO Beta 0.7 - compilación y publicación de actualizaciones
on:
  push:
    branches: [nodo-modular-v06]
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar APK firmado a usuarios (requiere secretos NODO_KEYSTORE_B64 y NODO_KEYSTORE_PASSWORD)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configurar firma (secretos privados, nunca publicar la clave)
        env:
          NODO_KEY_B64: ${{ secrets.NODO_KEYSTORE_B64 }}
          NODO_KEY_PASS: ${{ secrets.NODO_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$NODO_KEY_B64" && -n "$NODO_KEY_PASS" ]]; then
            printf "%s" "$NODO_KEY_B64" | base64 -d > "$RUNNER_TEMP/nodo-signing.p12"
            echo "NODO_SIGNING_FILE=$RUNNER_TEMP/nodo-signing.p12" >> "$GITHUB_ENV"
            echo "NODO_SIGNING_PASSWORD=$NODO_KEY_PASS" >> "$GITHUB_ENV"
            echo "NODO_CAN_PUBLISH=true" >> "$GITHUB_ENV"
          else
            echo "NODO_CAN_PUBLISH=false" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK release
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Publicar APK como artefacto de compilacion
        uses: actions/upload-artifact@v4
        with:
          name: NODO-Beta-v0.7-build
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publicar version a la app (solo lanzamiento manual autorizado y firmado)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar && env.NODO_CAN_PUBLISH == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          CODE="$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' app/build.gradle | head -1)"
          VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          test -n "$CODE"; test -n "$VERSION"
          DIR="downloads"
          mkdir -p "$DIR" updates
          NAME="NODO-Beta-v${VERSION}.apk"
          cp "$APK" "$DIR/$NAME"
          SHA="$(sha256sum "$DIR/$NAME" | cut -d' ' -f1)"
          python3 - "$CODE" "$VERSION" "$NAME" "$SHA" <<'PY'
          import json,sys
          code,version,name,sha=sys.argv[1:]
          url='https://raw.githubusercontent.com/Marcoglez98/Nodo-Android/nodo-modular-v06/downloads/'+name
          obj={'versionCode':int(code),'versionName':version,'notes':'Nueva versión de NODO Beta. Mejoras y correcciones disponibles para instalar desde la aplicación.','apkUrl':url,'sha256':sha}
          open('updates/beta.json','w',encoding='utf-8').write(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "nodo-updater-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR/$NAME" updates/beta.json
          git commit -m "Publicar NODO $VERSION (firma estable)"
          git push origin HEAD:nodo-modular-v06
      - name: Publicación omitida (sin clave o sin aprobación)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar && env.NODO_CAN_PUBLISH != 'true' }}
        run: |
          echo "::error::Faltan secretos de firma NODO_KEYSTORE_B64 y NODO_KEYSTORE_PASSWORD. No se publicará un APK sin firmar."
          exit 1
