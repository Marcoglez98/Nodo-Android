plugins { id 'com.android.application' }

android {
    namespace 'com.nodo.messenger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nodo.messenger.beta'
        minSdk 26
        targetSdk 35
        versionCode 41
        versionName '0.4.1-beta'
    }

    // Firma estable opcional, cargada desde secretos de GitHub Actions.
    // Nunca subir el archivo de claves al repositorio público.
    def nodoSigningFile = System.getenv("NODO_SIGNING_FILE")
    signingConfigs {
        nodoRelease {
            if (nodoSigningFile) {
                storeFile file(nodoSigningFile)
                storePassword System.getenv("NODO_SIGNING_PASSWORD")
                keyAlias 'nodo'
                keyPassword System.getenv("NODO_SIGNING_PASSWORD")
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (nodoSigningFile) signingConfig signingConfigs.nodoRelease
        }
        debug { applicationIdSuffix '' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
